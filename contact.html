
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Multilex Agencies</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Multilex<span class="dot">.</span></a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html">Products</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="container content-block">
    <h1>Contact Us</h1>
    <p class="lead">Send us a message or reach us on WhatsApp to discuss partnerships and projects.</p>
    <form class="contact-form" onsubmit="handleContact(event)">
      <div class="grid-2">
        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Your email" required>
      </div>
      <textarea name="message" rows="6" placeholder="Your message" required></textarea>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Send Message</button>
      </div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
